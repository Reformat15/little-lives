<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Lives — AI Family House</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E🏠%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f3f6ff;font:14px system-ui,Arial,sans-serif;overflow:hidden}#scene{position:fixed;inset:0}#panel{position:fixed;top:14px;left:14px;width:min(315px,calc(100vw - 28px));padding:14px;background:#111c30e8;border:1px solid #40516c;border-radius:16px;backdrop-filter:blur(10px)}h1{margin:0;font-size:20px}#clock{color:#b9c7e1;margin:5px 0 10px}.person{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.person small{color:#bdc8dc}.bar{height:5px;background:#31405a;border-radius:8px;overflow:hidden;margin-top:4px}.bar>span{display:block;height:100%;background:#75d8b1}.stat{width:95px;text-align:right}#controls{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:#111c30e8;border:1px solid #40516c;border-radius:14px}button{background:#6565ee;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;white-space:nowrap}button:hover{background:#7b7bf5}#hint{position:fixed;right:16px;top:15px;color:#c3cde0;text-align:right;font-size:12px}#error{display:none;position:fixed;left:12px;right:12px;bottom:90px;padding:12px;background:#692c35;color:white;border-radius:10px;z-index:10}@media(max-width:650px){#panel{width:245px;padding:10px}h1{font-size:17px}.person{font-size:12px}.stat{width:75px}#hint{top:auto;bottom:86px;right:12px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}
</script>
</head>
<body>
<div id="scene"></div>
<section id="panel"><h1>🏠 Little Lives</h1><div id="clock">Loading family...</div><div id="family"></div></section>
<div id="hint">Drag to rotate · Scroll / pinch to zoom</div>
<div id="controls"><button id="pause">⏸ Pause</button><button id="speed">1× Speed</button><button id="reset">↺ Reset</button></div>
<div id="error"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
try {
const scene=new THREE.Scene();scene.background=new THREE.Color('#101827');
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(12,14,17);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.minDistance=9;controls.maxDistance=34;controls.maxPolarAngle=Math.PI/2.06;controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x65758c,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-5,12,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.85});
function box(x,y,z,w,h,d,color){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
function sphere(x,y,z,r,color){const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat(color));mesh.position.set(x,y,z);mesh.castShadow=true;scene.add(mesh);return mesh}
// House: front walls omitted for an unobstructed dollhouse view.
box(0,-.22,0,10,.35,8,'#677789');box(-2.5,-.025,0,4.95,.07,7.9,'#d6c7aa');box(2.5,-.02,0,4.95,.07,7.9,'#e0d2bd');
box(-2.5,-.005,-2,4.9,.03,3.9,'#a7d4b1');box(2.5,-.004,-2,4.9,.03,3.9,'#d5b9d9');
box(0,1,-4,10,2,.16,'#f4e9d5');box(-5,1,0,.16,2,8,'#f4e9d5');box(5,1,0,.16,2,8,'#f4e9d5');
// Rear half-height partitions keep the rooms visible.
box(0,.4,-2,.12,.8,3.5,'#f1e6d6');box(0,.4,2,.12,.8,3.4,'#f1e6d6');box(-3,.35,0,3.8,.7,.12,'#f1e6d6');box(3,.35,0,3.8,.7,.12,'#f1e6d6');
// Living room, front left
box(-2.8,.25,2.6,2,.5,.8,'#5f8fbd');box(-2.8,.53,2.95,2,.55,.22,'#5f8fbd');box(-2.8,.15,1.4,1.25,.28,.65,'#b78662');box(-4.2,.48,1.25,.18,.85,1.3,'#263e59');
// Kitchen, front right
box(3.6,.38,3.15,2.2,.75,.65,'#a7c5bf');box(2.3,.36,1.55,1.3,.12,1.1,'#ad825c');for(const x of [1.8,2.8])for(const z of [1.1,2])box(x,.2,z,.32,.4,.32,'#8d664d');
// Bedroom, rear left
box(-2.7,.24,-2.75,2.2,.4,1.65,'#a58ec8');box(-2.7,.48,-3.25,1.9,.15,.4,'#f4f0e8');box(-4.2,.55,-3.15,.65,1.1,.75,'#9b735c');
// Bathroom, rear right
box(3.4,.25,-2.7,1.7,.45,1.4,'#e7edf1');box(1.6,.4,-3.2,.65,.8,.55,'#b5d9e7');box(4.35,.27,-1.3,.65,.54,.65,'#f2f4f7');
// Decorative rugs
box(-2.6,.025,1.85,2.7,.025,1.2,'#e6b7a3');box(2.65,.025,-1.5,2.5,.025,1.2,'#c9e5e5');
const rooms={living:{x:-2.6,z:1.7},kitchen:{x:2.65,z:1.5},bedroom:{x:-2.6,z:-1.7},bathroom:{x:2.6,z:-1.6}};
const profiles=[{name:'Dad',color:'#547fe0',start:'living'},{name:'Mom',color:'#e36f9e',start:'kitchen'},{name:'Alex',color:'#e4b24e',start:'bedroom'},{name:'Mia',color:'#8d7ce1',start:'living'}];
const family=profiles.map((p,i)=>{const group=new THREE.Group();scene.add(group);const body=new THREE.Mesh(new THREE.CylinderGeometry(.24,.3,.68,10),mat(p.color));body.position.y=.48;body.castShadow=true;group.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,14,12),mat('#f1c9a6'));head.position.y=1.03;head.castShadow=true;group.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.235,14,12),mat(i===1?'#593c2f':'#3b302e'));hair.scale.y=.45;hair.position.y=1.17;group.add(hair);const start=rooms[p.start];group.position.set(start.x+(i%2)*.5-.25,.04,start.z+(i%2)*.5-.25);return {...p,group,room:p.start,target:group.position.clone(),hunger:75-i*8,energy:75+i*5,happiness:85-i*4,action:'Exploring',timer:0}});
let minutes=7*60,paused=false,speed=1,elapsed=0;const clamp=n=>Math.max(0,Math.min(100,n));const rand=(a,b)=>a+Math.random()*(b-a);
function choose(p){let room,action;if(p.energy<28){room='bedroom';action='Sleeping'}else if(p.hunger<35){room='kitchen';action='Eating'}else if(Math.random()<.18){room='bathroom';action='Bathing'}else{room=Math.random()<.55?'living':'kitchen';action=room==='living'?'Relaxing':'Cooking'}p.room=room;p.action='Walking to '+room;const r=rooms[room];p.target.set(r.x+rand(-.65,.65),.04,r.z+rand(-.5,.5));p.nextAction=action;p.timer=rand(4,8)}
function update(dt){minutes+=dt*3;for(const p of family){p.hunger=clamp(p.hunger-dt*.55);p.energy=clamp(p.energy-dt*.35);p.happiness=clamp(p.happiness-dt*.12);const direction=p.target.clone().sub(p.group.position);direction.y=0;if(direction.length()>.08){direction.normalize();p.group.position.addScaledVector(direction,Math.min(dt*1.2,p.group.position.distanceTo(p.target)));p.group.rotation.y=Math.atan2(direction.x,direction.z)}else{p.action=p.nextAction||p.action;p.timer-=dt;if(p.action==='Eating')p.hunger=clamp(p.hunger+dt*8);if(p.action==='Sleeping')p.energy=clamp(p.energy+dt*7);if(p.action==='Relaxing')p.happiness=clamp(p.happiness+dt*3);if(p.timer<=0)choose(p)}}}
function refreshUI(){const h=Math.floor(minutes/60)%24,m=Math.floor(minutes%60);document.querySelector('#clock').textContent=`Day ${Math.floor(minutes/1440)+1} · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;document.querySelector('#family').innerHTML=family.map(p=>`<div class="person"><div><strong style="color:${p.color}">●</strong> ${p.name}<br><small>${p.action}</small></div><div class="stat"><small>🍽 ${Math.round(p.hunger)} · ⚡ ${Math.round(p.energy)}</small><div class="bar"><span style="width:${p.happiness}%"></span></div></div></div>`).join('')}
let previous=performance.now(),uiTime=0;function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-previous)/1000,.05);previous=now;if(!paused)update(dt*speed);controls.update();renderer.render(scene,camera);uiTime+=dt;if(uiTime>.25){refreshUI();uiTime=0}}family.forEach(choose);refreshUI();requestAnimationFrame(animate);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ Play':'⏸ Pause'};
document.querySelector('#speed').onclick=e=>{speed=speed===1?3:speed===3?6:1;e.target.textContent=speed+'× Speed'};
document.querySelector('#reset').onclick=()=>location.reload();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
} catch(err){console.error(err);const el=document.querySelector('#error');el.style.display='block';el.textContent='3D rendering error: '+err.message;}
</script>
</body>
</html>
