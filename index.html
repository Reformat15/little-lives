<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Little Lives — AI Family House</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111827;
        color: #f8fafc;
        font-family: system-ui, Arial, sans-serif;
        overflow: hidden;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        width: min(310px, calc(100vw - 28px));
        background: #111827df;
        border: 1px solid #475569;
        border-radius: 16px;
        padding: 14px;
        backdrop-filter: blur(8px);
        max-height: 65vh;
        overflow: auto;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        font-size: 12px;
        color: #cbd5e1;
        margin-bottom: 10px;
      }
      .person {
        border-top: 1px solid #334155;
        padding: 8px 0;
        font-size: 13px;
      }
      .name {
        font-weight: 700;
      }
      .action {
        color: #a5b4fc;
      }
      .meter {
        height: 5px;
        background: #334155;
        border-radius: 5px;
        overflow: hidden;
        margin: 4px 0 6px;
      }
      .fill {
        height: 100%;
        background: #34d399;
      }
      #toolbar {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        background: #111827dd;
        padding: 9px;
        border-radius: 14px;
        border: 1px solid #475569;
      }
      button {
        border: 0;
        border-radius: 9px;
        background: #6366f1;
        color: white;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.96);
      }
      #clock {
        font-size: 13px;
        color: #fbbf24;
        margin: 4px 0 10px;
      }
      #help {
        position: fixed;
        right: 12px;
        top: 12px;
        font-size: 12px;
        background: #111827aa;
        padding: 9px;
        border-radius: 9px;
        color: #e2e8f0;
      }
      @media (max-width: 650px) {
        #hud {
          top: 8px;
          left: 8px;
          width: 210px;
          padding: 10px;
          max-height: 43vh;
        }
        h1 {
          font-size: 15px;
        }
        #help {
          top: auto;
          bottom: 84px;
          right: 8px;
          font-size: 10px;
        }
        #toolbar {
          bottom: 8px;
        }
        button {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <section id="hud">
      <h1>🏡 Little Lives</h1>
      <div class="sub">Your tiny autonomous family</div>
      <div id="clock"></div>
      <div id="family"></div>
    </section>
    <div id="help">Drag to orbit · Scroll/pinch to zoom</div>
    <div id="toolbar">
      <button id="pause">⏸ Pause</button><button id="speed">1× Speed</button
      ><button id="reset">↺ Reset</button>
    </div>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js";
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#a9c9dd");
      const camera = new THREE.PerspectiveCamera(
        42,
        innerWidth / innerHeight,
        0.1,
        100,
      );
      camera.position.set(14, 17, 20);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.querySelector("#scene").appendChild(renderer.domElement);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      controls.minDistance = 9;
      controls.maxDistance = 40;
      controls.maxPolarAngle = Math.PI / 2.05;
      controls.update();
      scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a0, 2));
      const sun = new THREE.DirectionalLight(0xffffff, 2.1);
      sun.position.set(-5, 15, 8);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -14;
      sun.shadow.camera.right = 14;
      sun.shadow.camera.top = 14;
      sun.shadow.camera.bottom = -14;
      scene.add(sun);
      const mat = (c) =>
        new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });
      const floorMat = mat("#e6d6bb");
      function box(x, y, z, w, h, d, color, cast = true) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          typeof color === "string" ? mat(color) : color,
        );
        m.position.set(x, y, z);
        m.castShadow = cast;
        m.receiveShadow = true;
        scene.add(m);
        return m;
      }
      function ball(parent, x, y, z, r, color) {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(r, 12, 10),
          mat(color),
        );
        m.position.set(x, y, z);
        m.castShadow = true;
        parent.add(m);
        return m;
      }
      box(0, -0.25, 0, 13, 0.5, 10, "#7d9b76");
      box(0, -0.015, 0, 12, 0.08, 9, floorMat); // outer walls and low room dividers
      box(0, 0.85, -4.5, 12, 1.7, 0.16, "#f6f0e8");
      box(-6, 0.85, 0, 0.16, 1.7, 9, "#f6f0e8");
      box(6, 0.85, 0, 0.16, 1.7, 9, "#f6f0e8");
      box(0, 0.85, 4.5, 12, 1.7, 0.16, "#f6f0e8");
      box(0, 0.25, 0, 0.12, 0.5, 9, "#faf7ef");
      box(0, 0.25, 0, 12, 0.5, 0.12, "#faf7ef");
      // room rugs, furniture: front left living, front right kitchen, rear left bedroom, rear right bathroom
      box(-3, 0.035, 2.3, 4.6, 0.04, 3, "#a9c4b8");
      box(-4.5, 0.45, 2.9, 1.1, 0.7, 2.4, "#d08d79");
      box(-4.5, 0.87, 3.85, 1.1, 0.5, 0.35, "#d08d79");
      box(-3, 0.25, 1.5, 1.6, 0.4, 1, "#b47c52");
      box(-1, 0.7, 3.7, 0.3, 1.2, 1.2, "#475569");
      box(3, 0.035, 2.2, 4.7, 0.04, 3.2, "#efd2a6");
      box(4.7, 0.48, 3.4, 2, 0.9, 0.8, "#b7d5c3");
      box(4.7, 1, 3.4, 2, 0.12, 0.8, "#f8fafc");
      box(2.8, 0.5, 1.5, 1.7, 0.14, 1.4, "#b77f4f");
      for (const [x, z] of [
        [2.1, 1.5],
        [3.5, 1.5],
        [2.8, 0.8],
        [2.8, 2.2],
      ])
        box(x, 0.26, z, 0.45, 0.5, 0.45, "#a47753");
      box(-3, 0.035, -2.3, 4.7, 0.04, 3.2, "#c5b6d6");
      box(-4.1, 0.34, -2.4, 2.5, 0.5, 2.2, "#f8fafc");
      box(-4.1, 0.64, -2.4, 2.2, 0.13, 1.8, "#a9b7ed");
      box(-4.1, 0.77, -3.1, 1.7, 0.15, 0.4, "#fff2d6");
      box(-1.4, 0.55, -3.2, 0.7, 1.1, 0.8, "#b98c69");
      box(3, 0.035, -2.3, 4.7, 0.04, 3.2, "#c7e8e9");
      box(4.2, 0.25, -2.9, 2.1, 0.4, 1.2, "#ffffff");
      box(4.2, 0.6, -3.4, 2.1, 0.65, 0.18, "#f8fafc");
      box(1.8, 0.43, -3.1, 0.9, 0.75, 0.75, "#e2e8f0");
      box(1.8, 0.85, -3.1, 0.5, 0.12, 0.5, "#ffffff");
      box(4.8, 0.3, -1.2, 0.7, 0.6, 0.7, "#f8fafc");
      // house labels as floating sprites
      function label(text, x, z) {
        const c = document.createElement("canvas");
        c.width = 256;
        c.height = 64;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#243447";
        ctx.font = "bold 30px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(text, 128, 42);
        const t = new THREE.CanvasTexture(c);
        const s = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: t, transparent: true }),
        );
        s.position.set(x, 1.7, z);
        s.scale.set(2.8, 0.7, 1);
        scene.add(s);
      }
      label("LIVING", -3, 3.7);
      label("KITCHEN", 3, 3.7);
      label("BEDROOM", -3, -3.8);
      label("BATHROOM", 3, -3.8);
      const spots = {
        living: [-2.7, 2.3],
        kitchen: [3, 2.4],
        bedroom: [-3, -2],
        bathroom: [3, -2.2],
      };
      const roles = [
        { name: "Dad", color: "#4f7cbd", hair: "#33251d", speed: 1.2 },
        { name: "Mom", color: "#d77691", hair: "#4c3028", speed: 1.3 },
        { name: "Alex", color: "#6d9f66", hair: "#36231b", speed: 1.55 },
        { name: "Mia", color: "#e6a64f", hair: "#5a3925", speed: 1.45 },
      ];
      const people = roles.map((p, i) => {
        const g = new THREE.Group();
        const h = i < 2 ? 1.0 : 0.78;
        const torso = new THREE.Mesh(
          new THREE.CylinderGeometry(0.24, 0.3, h * 0.58, 10),
          mat(p.color),
        );
        torso.position.y = h * 0.45;
        torso.castShadow = true;
        g.add(torso);
        ball(g, 0, h * 0.9, 0, 0.23, i === 1 ? "#e5ae86" : "#d9a17c");
        const hair = new THREE.Mesh(
          new THREE.SphereGeometry(
            0.235,
            12,
            8,
            0,
            Math.PI * 2,
            0,
            Math.PI * 0.45,
          ),
          mat(p.hair),
        );
        hair.position.y = h * 0.99;
        g.add(hair);
        for (const dx of [-0.1, 0.1])
          ball(g, dx, h * 0.9, 0.2, 0.025, "#222222");
        g.position.set(-4 + i * 0.65, 0.08, 2.1);
        scene.add(g);
        return {
          ...p,
          mesh: g,
          hunger: 60 + Math.random() * 35,
          energy: 65 + Math.random() * 35,
          happy: 75,
          room: "living",
          target: "living",
          action: "Relaxing",
          wait: 0,
          walking: false,
        };
      });
      let paused = false,
        multiplier = 1,
        minutes = 7 * 60;
      const clamp = (v) => Math.max(0, Math.min(100, v));
      function choose(p) {
        if (p.energy < 30) {
          p.target = "bedroom";
          p.action = "Going to sleep";
        } else if (p.hunger < 35) {
          p.target = "kitchen";
          p.action = "Going to eat";
        } else {
          const rooms = ["living", "kitchen", "bedroom", "bathroom"];
          p.target = rooms[Math.floor(Math.random() * rooms.length)];
          p.action = {
            living: "Relaxing",
            kitchen: "Having a snack",
            bedroom: "Taking a rest",
            bathroom: "Freshening up",
          }[p.target];
        }
        p.wait = 3 + Math.random() * 5;
        p.walking = true;
      }
      function update(dt) {
        minutes += dt * 2.5;
        for (const p of people) {
          p.hunger = clamp(p.hunger - dt * 0.3);
          p.energy = clamp(p.energy - dt * 0.19);
          p.happy = clamp(p.happy - dt * 0.09);
          if (p.walking) {
            const [x, z] = spots[p.target];
            const dx = x - p.mesh.position.x,
              dz = z - p.mesh.position.z,
              dist = Math.hypot(dx, dz);
            if (dist > 0.12) {
              const step = Math.min(dist, p.speed * dt);
              p.mesh.position.x += (dx / dist) * step;
              p.mesh.position.z += (dz / dist) * step;
              p.mesh.rotation.y = Math.atan2(dx, dz);
              p.action = "Walking to " + p.target;
            } else {
              p.walking = false;
              p.room = p.target;
              p.wait = 4 + Math.random() * 6;
            }
          } else {
            p.wait -= dt;
            if (p.room === "kitchen") p.hunger = clamp(p.hunger + dt * 5);
            if (p.room === "bedroom") p.energy = clamp(p.energy + dt * 3.8);
            if (p.room === "living") p.happy = clamp(p.happy + dt * 2.2);
            if (p.room === "bathroom") p.happy = clamp(p.happy + dt * 1.2);
            if (p.wait <= 0) choose(p);
          }
        }
      }
      function ui() {
        const hh = Math.floor(minutes / 60) % 24,
          mm = Math.floor(minutes % 60);
        document.querySelector("#clock").textContent =
          "🕒 Day " +
          (Math.floor(minutes / 1440) + 1) +
          " · " +
          String(hh).padStart(2, "0") +
          ":" +
          String(mm).padStart(2, "0");
        document.querySelector("#family").innerHTML = people
          .map(
            (p) =>
              `<div class="person"><span class="name">${p.name}</span> · <span class="action">${p.action}</span><div>🍲 Hunger ${Math.round(p.hunger)} · ⚡ Energy ${Math.round(p.energy)} · 😊 ${Math.round(p.happy)}</div><div class="meter"><div class="fill" style="width:${p.energy}%;background:${p.energy < 30 ? "#fb7185" : "#34d399"}"></div></div></div>`,
          )
          .join("");
      }
      const clock = new THREE.Clock();
      let uiElapsed = 0;
      function animate() {
        requestAnimationFrame(animate);
        const realDt = Math.min(clock.getDelta(), 0.05);
        if (!paused) {
          const dt = realDt * multiplier;
          update(dt);
          uiElapsed += realDt;
          if (uiElapsed > 0.3) {
            ui();
            uiElapsed = 0;
          }
        }
        controls.update();
        renderer.render(scene, camera);
      }
      ui();
      animate();
      document.querySelector("#pause").onclick = (e) => {
        paused = !paused;
        e.target.textContent = paused ? "▶ Play" : "⏸ Pause";
      };
      document.querySelector("#speed").onclick = (e) => {
        multiplier = multiplier === 1 ? 3 : multiplier === 3 ? 6 : 1;
        e.target.textContent = multiplier + "× Speed";
      };
      document.querySelector("#reset").onclick = () => location.reload();
      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
