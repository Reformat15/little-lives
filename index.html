 if(Array.isArray(saved.history))conversation=saved.history.filter(x=>x&&typeof x.speaker==='string'&&typeof x.text==='string').slice(-24);
 if(Number.isInteger(saved.sceneNumber))sceneNumber=Math.max(0,saved.sceneNumber);
 if(typeof saved.lastTopic==='string')lastTopic=saved.lastTopic.slice(0,80);
} catch(e) { console.warn('Conversation memory unavailable',e); }
function saveMemory(){try{localStorage.setItem(MEMORY_KEY,JSON.stringify({history:conversation.slice(-24),sceneNumber,lastTopic}))}catch(e){}}

const labelLayer=document.querySelector('#labels');
const labels=new Map();
for(const p of family){
 const el=document.createElement('div');el.className='char-label';
 const bubble=document.createElement('div');bubble.className='char-bubble';bubble.hidden=true;
 const name=document.createElement('div');name.className='char-name';name.textContent=p.name;name.style.borderColor=p.color;
 el.append(bubble,name);labelLayer.append(el);labels.set(p,{el,bubble});
}
const labelPoint=new THREE.Vector3();
function updateLabels(){
 for(const p of family){
  const {el,bubble}=labels.get(p);
  labelPoint.copy(p.root.position);labelPoint.y+=p.name==='Alex'||p.name==='Mia'?1.65:1.95;
  labelPoint.project(camera);
  const visible=labelPoint.z>-1&&labelPoint.z<1&&Math.abs(labelPoint.x)<1.2&&Math.abs(labelPoint.y)<1.2;
  el.classList.toggle('offscreen',!visible);
  if(!visible)continue;
  el.style.left=((labelPoint.x+1)*.5*innerWidth)+'px';
  el.style.top=((-labelPoint.y+1)*.5*innerHeight-4)+'px';
  const talking=p.speechUntil>performance.now();
  bubble.hidden=!talking;
  if(talking&&bubble.textContent!==p.speech)bubble.textContent=p.speech;
 }
}
const panel=document.querySelector('#panel'),minBtn=document.querySelector('#minimize');
minBtn.onclick=()=>{
 const collapsed=panel.classList.toggle('minimized');
 minBtn.textContent=collapsed?'+':'−';
 minBtn.setAttribute('aria-label',collapsed?'Expand family status':'Minimize family status');
};
function say(p,line){p.speech=String(line).slice(0,160);p.speechUntil=performance.now()+11500;const div=document.createElement('div');div.textContent=p.name+': “'+p.speech+'”';document.querySelector('#log').prepend(div);while(document.querySelector('#log').children.length>7)document.querySelector('#log').lastChild.remove();p.memories.push(p.speech);p.memories=p.memories.slice(-5);conversation.push({speaker:p.name,text:p.speech});conversation=conversation.slice(-24);lastSpeaker=p.name;saveMemory()}
function choose(p,forced){
 let room,action;
 if(forced){room=forced.room;action=forced.action}
 else if(p.energy<30){room='bedroom';action='Sleeping'}
 else if(p.hunger<35){room='kitchen';action='Eating'}
 else if(Math.random()<.15){room='bathroom';action='Bathing'}
 else{room=Math.random()<.55?'living':'kitchen';action=room==='living'?'Relaxing':'Cooking'}
 const station=activityStations[action];
 // Physical activities have a fixed location, even when an AI response picks an incompatible room.
 if(station)room=station.room;
 p.room=room;p.action='Walking to '+(station?action.toLowerCase()+' station':room);
 p.nextAction=action;
 if(station){p.target=new THREE.Vector3(station.x*HOUSE_SCALE+rand(-.13,.13),.04,station.z*HOUSE_SCALE+rand(-.12,.12))}
 else{const r=rooms[room];p.target=new THREE.Vector3(r.x+rand(-.6,.6),.04,r.z+rand(-.45,.45))}
 p.timer=rand(7,13);
}
// Offline conversations are linked mini-scenes, not unrelated random one-liners.
// The queue is shared by offline and Gemini so speakers respond in sequence.
const offlineScenes=[
 [{character:'Mia',room:'living',action:'Talking',dialogue:'Can someone read a story with me?'},{character:'Dad',room:'living',action:'Talking',dialogue:'Of course, Mia. Which story would you like?'},{character:'Mia',room:'living',action:'Talking',dialogue:'The one with the dragon who is afraid of flying!'},{character:'Alex',room:'living',action:'Talking',dialogue:'I love that one. Can I listen too?'},{character:'Mom',room:'living',action:'Talking',dialogue:'I will join you after I make some tea.'}],
 [{character:'Alex',room:'kitchen',action:'Talking',dialogue:'Mom, what are we having for dinner?'},{character:'Mom',room:'kitchen',action:'Cooking',dialogue:'I was thinking of pasta. Want to help me?'},{character:'Alex',room:'kitchen',action:'Talking',dialogue:'Yes! Can I stir the sauce?'},{character:'Dad',room:'kitchen',action:'Talking',dialogue:'I can set the table while you two cook.'},{character:'Mia',room:'kitchen',action:'Talking',dialogue:'I will bring the napkins!'}],
 [{character:'Dad',room:'living',action:'Talking',dialogue:'How did everyone sleep last night?'},{character:'Mia',room:'living',action:'Talking',dialogue:'I dreamed our house was on the moon!'},{character:'Mom',room:'living',action:'Talking',dialogue:'That sounds amazing. Was there a garden?'},{character:'Mia',room:'living',action:'Talking',dialogue:'Yes, with purple flowers and tiny aliens!'},{character:'Alex',room:'living',action:'Talking',dialogue:'Next time, take me on your moon adventure.'}],
 [{character:'Mom',room:'living',action:'Talking',dialogue:'Should we plan something fun for the weekend?'},{character:'Alex',room:'living',action:'Talking',dialogue:'Can we go to the park and play soccer?'},{character:'Dad',room:'living',action:'Talking',dialogue:'That sounds good. We can pack a picnic.'},{character:'Mia',room:'living',action:'Talking',dialogue:'Can I bring my teddy bear?'},{character:'Mom',room:'living',action:'Talking',dialogue:'Absolutely. Teddy can come on the picnic too.'}],
 [{character:'Alex',room:'living',action:'Talking',dialogue:'Dad, I need help with my homework.'},{character:'Dad',room:'living',action:'Talking',dialogue:'Sure, Alex. What part is confusing?'},{character:'Alex',room:'living',action:'Talking',dialogue:'The fractions. They keep mixing me up.'},{character:'Mom',room:'living',action:'Talking',dialogue:'We can use slices of pizza to explain them.'},{character:'Mia',room:'living',action:'Talking',dialogue:'I volunteer to eat the pizza!'}]
];
function queueOfflineScene(){
 if(dialogueQueue.length||aiBusy)return;
 const index=sceneNumber++%offlineScenes.length;
 const scene=offlineScenes[index];
 const topics=['dragon story','cooking pasta','dream about the moon','weekend picnic','homework fractions'];
 currentTopic=topics[index];lastTopic=currentTopic;
 dialogueQueue.push(...scene);nextLineAt=performance.now()+2800;saveMemory();
 status.textContent='Offline family conversation';
}
function update(dt,t,realDt){
 minutes+=dt*3;
 offlineTalkTimer+=realDt;
 if((!aiEnabled||aiOfflineFallback)&&!dialogueQueue.length&&offlineTalkTimer>65){offlineTalkTimer=0;queueOfflineScene()}
 for(const p of family){
  p.hunger=clamp(p.hunger-dt*.55);p.energy=clamp(p.energy-dt*.35);p.happiness=clamp(p.happiness-dt*.12);
  if(!p.target)choose(p);
  const diff=p.target.clone().sub(p.root.position);diff.y=0;
  const walking=diff.length()>.09;
  if(walking){const move=Math.min(diff.length(),dt*1.15);diff.normalize();p.root.position.addScaledVector(diff,move);p.root.rotation.y=Math.atan2(diff.x,diff.z)}
  else{p.action=p.nextAction;p.timer-=dt;
   if(p.action==='Eating')p.hunger=clamp(p.hunger+dt*8);
   if(p.action==='Sleeping')p.energy=clamp(p.energy+dt*7);
   if(p.action==='Relaxing'||p.action==='Talking'||p.action==='Playing'||p.action==='Reading')p.happiness=clamp(p.happiness+dt*2.5);
   if(p.timer<=0)choose(p);
  }
  const swing=walking?Math.sin(t*.008*speed+p.phase)*.60:0;
  p.arms[0].rotation.x=swing;p.arms[1].rotation.x=-swing;
  p.legs[0].rotation.x=-swing;p.legs[1].rotation.x=swing;
  if(!walking&&p.action==='Cooking')p.arms[0].rotation.z=-.35+Math.sin(t*.012)*.22;
  else if(!walking&&p.action==='Eating')p.arms[0].rotation.z=-.55+Math.sin(t*.009)*.16;
  else if(!walking&&p.speechUntil>performance.now())p.arms[0].rotation.z=-.22+Math.sin(t*.01)*.16;
  else p.arms[0].rotation.z=0;
  p.rig.position.y=walking?Math.abs(Math.sin(t*.008*speed+p.phase))*.05:0;
 }
}
function ui(){const h=Math.floor(minutes/60)%24,m=Math.floor(minutes%60);document.querySelector('#clock').textContent=`Day ${Math.floor(minutes/1440)+1} · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;document.querySelector('#family').innerHTML=family.map(p=>`<div class="person"><div><b style="color:${p.color}">●</b> ${p.name}<br><small>${p.action}</small>${p.speechUntil>performance.now()?`<div class="talk">💬 ${escapeHTML(p.speech)}</div>`:''}</div><div class="stats">🍽 ${Math.round(p.hunger)} · ⚡ ${Math.round(p.energy)}<div class="bar"><span style="width:${p.happiness}%"></span></div></div></div>`).join('')}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const allowedRooms=Object.keys(rooms),allowedActions=['Eating','Sleeping','Relaxing','Cooking','Bathing','Talking','Playing','Reading'];
// A single Gemini request creates a short, connected conversation among the four agents.
// We play each line in order, with pauses, so speech bubbles do not overlap.
function playDialogue(t){
 if(paused||!dialogueQueue.length||t<nextLineAt)return;
 const d=dialogueQueue.shift();const p=family.find(x=>x.name===d.character);
 if(p){
   if(allowedRooms.includes(d.room)&&allowedActions.includes(d.action))choose(p,{room:d.room,action:d.action});
   if(d.dialogue)say(p,d.dialogue);const listener=family.find(x=>x.name===dialogueQueue[0]?.character);if(listener&&listener!==p){const direction=listener.root.position.clone().sub(p.root.position);p.root.rotation.y=Math.atan2(direction.x,direction.z)}
 }
 // Reading time is based on real seconds, not the simulation speed.
 nextLineAt=t+Math.max(8500,Math.min(15500,2200+(d.dialogue||'').length*125));
 if(!dialogueQueue.length){offlineTalkTimer=0;lastTopic=currentTopic;saveMemory();}

}
async function askGemini(){
 if(!aiEnabled||aiBusy||paused||dialogueQueue.length)return;
 const endpoint=document.querySelector('#endpoint').value.trim();
 if(!/^https:\/\/[^\s/]+\.workers\.dev\/?$/.test(endpoint)){
  status.textContent='Set a valid HTTPS Worker URL';aiEnabled=false;document.querySelector('#ai').textContent='Enable Gemini';return;
 }
 aiBusy=true;status.textContent='Family thinking…';
 const payload={
  time:`${Math.floor(minutes/60)%24}:${String(Math.floor(minutes%60)).padStart(2,'0')}`,
  family:family.map(p=>({name:p.name,trait:p.trait,room:p.room,action:p.action,hunger:Math.round(p.hunger),energy:Math.round(p.energy),happiness:Math.round(p.happiness),memories:p.memories})),
  history:conversation.slice(-20),
  currentTopic:lastTopic,
  instruction:'Continue the existing topic naturally. Make replies directly address earlier speakers; avoid abrupt topic changes and repeated openings.'
 };
 try{
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),23000);
  let response;
  try{response=await fetch(endpoint.replace(/\/$/,''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal})}
  finally{clearTimeout(timeout)}
  if(!response.ok)throw new Error('Worker HTTP '+response.status);
  const result=await response.json();
  const turns=Array.isArray(result.turns)?result.turns:(result.character?[result]:[]);
  const valid=turns.filter(d=>d&&family.some(p=>p.name===d.character)&&typeof d.dialogue==='string'&&d.dialogue.trim()&&allowedRooms.includes(d.room)&&allowedActions.includes(d.action)).slice(0,6);
  if(!valid.length)throw new Error('Unexpected AI response');
  aiOfflineFallback=false;offlineTalkTimer=0;
  dialogueQueue.push(...valid);nextLineAt=performance.now()+1800;currentTopic=lastTopic||'family conversation';status.textContent='Four AI personalities active ✓';
 }catch(e){aiOfflineFallback=true;offlineTalkTimer=66;status.textContent='Gemini unavailable · offline conversations';console.warn('Gemini request:',e)}
 finally{aiBusy=false;lastAI=performance.now()}
}
function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-(animate.last||t))/1000,.05);animate.last=t;if(!paused)update(dt*speed,t,dt);orbit.update();renderer.render(scene,camera);updateLabels();playDialogue(t);uiTime+=dt;if(uiTime>.25){ui();uiTime=0}if(aiEnabled&&!paused&&!aiBusy&&!dialogueQueue.length&&t-lastAI>110000){lastAI=t;askGemini()}}
family.forEach(p=>choose(p));
document.querySelector('#endpoint').value=DEFAULT_GEMINI_ENDPOINT;
document.querySelector('#ai').textContent='Disable Gemini';
status.textContent='Connecting to Gemini…';
ui();requestAnimationFrame(animate);askGemini();
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ Play':'⏸ Pause'};document.querySelector('#speed').onclick=e=>{speed=speed===1?3:speed===3?6:1;e.target.textContent=speed+'× Speed'};document.querySelector('#reset').onclick=()=>location.reload();
document.querySelector('#connect').onclick=()=>{const url=document.querySelector('#endpoint').value.trim();if(!/^https:\/\/[^\s/]+\.workers\.dev\/?$/.test(url)){status.textContent='Enter a valid HTTPS *.workers.dev URL';return}status.textContent='Endpoint set. Click Enable Gemini.';document.querySelector('#config').open=false};
document.querySelector('#ai').onclick=e=>{aiEnabled=!aiEnabled;e.target.textContent=aiEnabled?'Disable Gemini':'Enable Gemini';if(aiEnabled){aiOfflineFallback=false;dialogueQueue.length=0;lastAI=performance.now();askGemini()}else{aiOfflineFallback=false;dialogueQueue.length=0;offlineTalkTimer=0;status.textContent='Offline brains active · quiet time'}};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){console.error(err);const el=document.querySelector('#error');el.style.display='block';el.textContent='3D rendering error: '+err.message}
</script></body></html>
