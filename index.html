function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-(animate.last||t))/1000,.05);animate.last=t;if(!paused)update(dt*speed,t);orbit.update();renderer.render(scene,camera);updateLabels();uiTime+=dt;if(uiTime>.25){ui();uiTime=0}if(aiEnabled&&!paused&&!aiBusy&&t-lastAI>30000){lastAI=t;askGemini()}}
family.forEach(p=>choose(p));say(family[0],'Good morning, everyone!');ui();requestAnimationFrame(animate);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ Play':'⏸ Pause'};document.querySelector('#speed').onclick=e=>{speed=speed===1?3:speed===3?6:1;e.target.textContent=speed+'× Speed'};document.querySelector('#reset').onclick=()=>location.reload();
document.querySelector('#connect').onclick=()=>{const url=document.querySelector('#endpoint').value.trim();if(!/^https:\/\/[^\s/]+\.workers\.dev\/?$/.test(url)){status.textContent='Enter a valid HTTPS *.workers.dev URL';return}status.textContent='Endpoint set. Click Enable Gemini.';document.querySelector('#config').open=false};
document.querySelector('#ai').onclick=e=>{aiEnabled=!aiEnabled;e.target.textContent=aiEnabled?'Disable Gemini':'Enable Gemini';if(aiEnabled){lastAI=performance.now();askGemini()}else status.textContent='Offline brains active'};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){console.error(err);const el=document.querySelector('#error');el.style.display='block';el.textContent='3D rendering error: '+err.message}
</script></body></html>
